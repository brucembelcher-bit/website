<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeBruce.Org</title>
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico">

     <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Document</title>
  <p id="rgb"></p>
</head>
    <body>
    <header>
        <h1><img id="logo"  alt="BeBruce.Org" width="690" height="105"></h1>
    </header>
    <main>
        <div id="tv_container">
                <iframe width="260" height="260" src="https://www.youtube.com/embed/hMpx2pQZ8P0?si=sfaojGM0JeXKGhIP" 
                    title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; 
                    encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>

<style>
#tv_container {
    position: relative; 
    width: 1794px; 
    height: 1794px; 
    display: grid;
    place-items: center; 
}


#tv_container::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: url('images/background.png') no-repeat top left;
    background-size: contain;
    z-index: 30; 
    pointer-events: none; 
}

#tv_container iframe {
    position: relative;
    width: 280px; 
    height: 260px; 
    z-index: 10;
}
</style>
    </main>

    <footer>
        <p>&copy; 2026 BeBruce.Org</p>
    </footer>


  <script>
    
    let colorOne = Math.floor(Math.random() * 256);
    let colorTwo = Math.floor(Math.random() * 256);
    let colorThree = Math.floor(Math.random() * 256);


    document.body.style.backgroundColor = "rgb(" + colorOne + ", " + colorTwo + ", " + colorThree + ")";

    let logoNumber = Math.floor(Math.random() * 11);
    
    document.getElementById("logo").src = `images/BeBruce.Org${logoNumber}.png`;

    
  </script>
    </body>
    <style>
        .image-container {
             position: relative; /* Establishes positioning context */
                /* Optional: Adjust container size if needed, or let it fit the base image */
            display: inline-block; /* Helps container wrap tightly around the base image's size */
            }

        .image-base {
                 /* The base image can have default or specified dimensions */
             display: block; /* Helps with layout issues that can occur with inline images */
            }

        .image-overlay {
            position: absolute; /* Positions the overlay image relative to the container */
            top: 10px;    /* Example: 10 pixels from the top of the container */
            left: 50px;   /* Example: 50 pixels from the left of the container */
                /* Adjust size as needed */
            width: 50px;
            height: auto;
            }
        body {
            font-family: Georgia, serif;
            margin: 0;
            color: black;
            padding: 1rem;
            text-align: center;
        }

        header {
            color: black
            padding: 1rem;
            text-align: center;
            
        }

        footer {
            text-align: center;
            padding: 3px;
            background-color: rgba(247, 109, 123, 0.9)
            color: Tomato
    }
